name: Build & Release

# master更新和版本标签触发构建。
on:
  push:
    branches:
      - 'master'
    tags:
      - v*

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('nightly-{0}', github.sha) }}

# 同分支的新提交替代尚未完成的旧构建。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
            artifact_name: release-Android
            artifact_path: build/app/outputs/apk/release/*.apk
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      arch: ${{ steps.get_version.outputs.arch}}
    runs-on: ${{ matrix.os }}
    env:
      FLUTTER_VERSION: 3.44.8
    steps:
      # 检出当前分支。
      - name: Checkout
        uses: actions/checkout@v7
      # 准备Android签名文件。
      - name: Setup Android keystore
        if: matrix.target == 'Android'
        run: |
          echo "${{ secrets.ENCODED_KEYSTORE }}" | base64 -di > android/app/upload-keystore.jks
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties
      # 直接使用上游同版本Flutter源码。
      - name: Setup Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
      # 输出Flutter版本。
      - name: Output Flutter Version
        run: flutter --version

      # 准备JDK。
      - name: Setup JDK 17 (Android)
        if: matrix.target == 'Android'
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      # 安装应用依赖。
      - name: Flutter Pub Get
        run: |
          git config --global core.longpaths true
          flutter pub get
      - name: 验证应用行为
        run: flutter test
      # 读取应用版本。
      - name: Get app version
        id: get_version
        shell: bash
        run: |
          echo "version=$(head -n 5 pubspec.yaml | tail -n 1 | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
          echo "arch=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # 构建各架构的Android安装包。
      - name: Build Android
        if: matrix.target == 'Android'
        run: |
          flutter build apk -t lib/src/main.dart --release --split-per-abi
          cd build/app/outputs/apk/release
          mv app-arm64-v8a-release.apk JHenTai-${{ steps.get_version.outputs.version }}-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk JHenTai-${{ steps.get_version.outputs.version }}-armeabi-v7a.apk
          mv app-x86_64-release.apk JHenTai-${{ steps.get_version.outputs.version }}-x64.apk

      # 保存构建产物。
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
  Publish:
    name: Publish
    permissions:
      contents: write
      actions: read
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Make tmp dir
        run: mkdir /tmp/artifacts
      - name: Download all Artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
      - name: List all Artifacts
        run: ls -R /tmp/artifacts
      # 仅通过CI发布安装包。
      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Nightly Build {0}', github.sha) }}
          allowUpdates: true
          bodyFile: ${{ github.ref_type == 'tag' && format('changelog/{0}.md', github.ref_name) || '' }}
          artifacts: /tmp/artifacts/release-Android/*.apk
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          prerelease: ${{ github.ref_type != 'tag' }}

      # 读取更新日志。
      - name: Get changelog content
        id: get_changelog
        run: |
          # 为JSON保留更新日志换行。
          if [ "${{ github.ref_type }}" = "tag" ] && [ -f "changelog/${{ github.ref_name }}.md" ]; then
            CHANGELOG=$(cat changelog/${{ github.ref_name }}.md | jq -Rs .)
          else
            CHANGELOG=$(echo "Nightly build from commit ${{ github.sha }}" | jq -Rs .)
          fi
          echo "changelog=$CHANGELOG" >> "$GITHUB_OUTPUT"

      # 正式版使用标签版本，夜间版使用提交标识。
      - name: Get build version
        id: get_build_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            BUILD_VERSION=$(echo "${{ github.ref_name }}" | grep -oE '\+[0-9]+' | tr -d '+')
          else
            BUILD_VERSION=$(echo "${{ github.sha }}" | cut -c1-7)
          fi
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
